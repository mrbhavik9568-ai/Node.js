<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Maker - Canva Style Studio</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: var(--text-muted); margin-top: 6px; }

    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 860px) {
      .studio-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .panel h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
    }
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .template-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #0f172a;
      text-align: center;
    }
    .template-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .template-card.active { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
    .template-card img { width: 100%; height: 90px; object-fit: cover; }
    .template-card span { display: block; font-size: 0.75rem; padding: 6px 4px; color: var(--text-muted); }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="color"] {
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    .file-upload-box {
      border: 2px dashed var(--border);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      background: #0f172a;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    /* Poster Preview Canvas */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 450px;
    }
    .poster-canvas {
      width: 320px;
      height: 450px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      transition: all 0.3s ease;
    }
    .poster-logo {
      max-width: 70px;
      max-height: 40px;
      object-fit: contain;
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px;
      border-radius: 6px;
    }
    .poster-text {
      font-size: 1.6rem;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      line-height: 1.25;
      margin-top: auto;
      margin-bottom: 24px;
    }
    .poster-footer {
      font-size: 0.75rem;
      opacity: 0.8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .alert-box {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .alert-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
  </style>
</head>
<body>

  <header>
    <h1>🎨 Poster Maker Studio</h1>
    <p>Canva-style Poster Designer with Template Selection, Multer Upload, & Custom Background Colors</p>
  </header>

  <div class="studio-grid">
    <!-- Controls Panel -->
    <div class="panel">
      <h2>⚙️ Customize Design</h2>

      <div class="form-group">
        <label>1. Select Template (GET /templates)</label>
        <div id="templatesList" class="templates-grid">Loading templates...</div>
      </div>

      <div class="form-group">
        <label for="posterText">2. Poster Headline / Text (POST /design)</label>
        <input type="text" id="posterText" value="GLOBAL INNOVATION SUMMIT 2026" placeholder="Enter headline text...">
      </div>

      <div class="form-group">
        <label>3. Background Color (Task 5: AI Color Feature)</label>
        <div class="color-row">
          <input type="color" id="bgColor" value="#0f172a">
          <span id="hexValue" style="color: var(--text-muted); font-family: monospace;">#0f172a</span>
        </div>
      </div>

      <div class="form-group">
        <label>4. Upload Brand Logo (POST /upload via Multer)</label>
        <div class="file-upload-box">
          <input type="file" id="logoFileInput" accept="image/*">
          <p id="uploadStatus" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;">Select image to upload</p>
        </div>
      </div>

      <button id="saveDesignBtn" class="btn">🚀 Create Design (POST /design)</button>
      <div id="alertBox" class="alert-box"></div>
    </div>

    <!-- Live Preview Panel -->
    <div class="panel preview-container">
      <h2>👁️ Live Canvas Preview</h2>
      <div id="posterPreview" class="poster-canvas">
        <img id="logoPreview" class="poster-logo" style="display:none;" alt="Logo">
        <div id="canvasText" class="poster-text">GLOBAL INNOVATION SUMMIT 2026</div>
        <div id="canvasFooter" class="poster-footer">POWERED BY POSTER MAKER</div>
      </div>
    </div>
  </div>

  <script>
    let selectedTemplateId = 1;
    let uploadedLogoUrl = null;
    let templatesData = [];

    // Elements
    const templatesList = document.getElementById('templatesList');
    const posterTextInput = document.getElementById('posterText');
    const bgColorInput = document.getElementById('bgColor');
    const hexValue = document.getElementById('hexValue');
    const logoFileInput = document.getElementById('logoFileInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const saveDesignBtn = document.getElementById('saveDesignBtn');
    const alertBox = document.getElementById('alertBox');
    const posterPreview = document.getElementById('posterPreview');
    const canvasText = document.getElementById('canvasText');
    const logoPreview = document.getElementById('logoPreview');

    // 1. Fetch templates
    async function loadTemplates() {
      try {
        const res = await fetch('/templates');
        templatesData = await res.json();
        templatesList.innerHTML = '';
        templatesData.forEach((t, index) => {
          const card = document.createElement('div');
          card.className = `template-card ${index === 0 ? 'active' : ''}`;
          card.innerHTML = `
            <img src="${t.imageUrl}" alt="${t.name}">
            <span>${t.name}</span>
          `;
          card.onclick = () => selectTemplate(t.id);
          templatesList.appendChild(card);
        });
        selectTemplate(templatesData[0].id);
      } catch (e) {
        templatesList.innerHTML = '<span style="color:red;">Failed to load templates</span>';
      }
    }

    function selectTemplate(id) {
      selectedTemplateId = id;
      document.querySelectorAll('.template-card').forEach((c, idx) => {
        c.classList.toggle('active', templatesData[idx]?.id === id);
      });
      const t = templatesData.find(tpl => tpl.id === id);
      if (t) {
        bgColorInput.value = t.defaultBgColor;
        hexValue.textContent = t.defaultBgColor;
        updatePreview();
      }
    }

    // Update Preview
    function updatePreview() {
      const tpl = templatesData.find(t => t.id === selectedTemplateId);
      posterPreview.style.backgroundColor = bgColorInput.value;
      if (tpl) {
        posterPreview.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('${tpl.imageUrl}')`;
        canvasText.style.color = tpl.textColor || '#ffffff';
      }
      canvasText.textContent = posterTextInput.value || 'YOUR HEADLINE HERE';
      hexValue.textContent = bgColorInput.value;
    }

    posterTextInput.addEventListener('input', updatePreview);
    bgColorInput.addEventListener('input', updatePreview);

    // 2. Handle file upload (Task 4)
    logoFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('logo', file);
      uploadStatus.textContent = 'Uploading...';

      try {
        const res = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          uploadedLogoUrl = data.fileUrl;
          uploadStatus.textContent = `✓ Uploaded: ${data.filename}`;
          logoPreview.src = data.fileUrl;
          logoPreview.style.display = 'block';
        } else {
          uploadStatus.textContent = `❌ ${data.error || 'Upload error'}`;
        }
      } catch (err) {
        uploadStatus.textContent = `❌ Error: ${err.message}`;
      }
    });

    // 3. Save Design (Task 3 & 5)
    saveDesignBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/design', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: posterTextInput.value,
            templateId: selectedTemplateId,
            backgroundColor: bgColorInput.value,
            logoUrl: uploadedLogoUrl
          })
        });
        const result = await res.json();
        if (res.ok) {
          alertBox.className = 'alert-box alert-success';
          alertBox.style.display = 'block';
          alertBox.innerHTML = `🎉 Design Saved! Design ID: <b>#${result.design.designId}</b> (${result.design.templateName})`;
        } else {
          alert(result.error);
        }
      } catch (e) {
        alert('Network error while saving design');
      }
    });

    loadTemplates();
  </script>
</body>
</html>
